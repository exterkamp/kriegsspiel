<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kriegsspiel</title>
    <!-- No favicon file ships; an empty one stops the browser asking for /favicon.ico (a 404 on every load). -->
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #2a2118;
        font-family: serif;
      }
      #app {
        width: 100%;
        height: 100%;
      }
      #table {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #efe6c8;
        font-size: 13px;
        flex-wrap: wrap;
        max-width: calc(100% - 16px);
      }
      #marks[hidden] {
        display: none;
      }
      #marks {
        position: fixed;
        left: 8px;
        top: 44px;
        width: min(300px, calc(100% - 16px));
        background: rgba(42, 33, 24, 0.88);
        color: #efe6c8;
        font-size: 13px;
        padding: 8px;
        border-radius: 4px;
        box-sizing: border-box;
      }
      #marks-body[hidden] {
        display: none;
      }
      #marks:has(#marks-body[hidden]) {
        width: auto;
        display: inline-block;
      }
      #marks-toggle {
        margin-bottom: 4px;
      }
      #marks-tools,
      #marks-row,
      #overlays {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 4px;
      }
      #marks button[aria-pressed='true'] {
        background: #e8b923;
      }
      #mark-label {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 4px;
      }
      #login,
      #account {
        position: fixed;
        background: rgba(42, 33, 24, 0.92);
        color: #efe6c8;
        font-size: 13px;
        padding: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #login {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: calc(100% - 32px);
        padding: 16px;
      }
      #account {
        top: 8px;
        right: 8px;
      }
      #orders {
        position: fixed;
        background: rgba(42, 33, 24, 0.88);
        color: #efe6c8;
        font-size: 13px;
        padding: 8px;
        border-radius: 4px;
        box-sizing: border-box;
      }
      #lobby,
      #sides {
        position: fixed;
        background: rgba(42, 33, 24, 0.95);
        color: #efe6c8;
        font-size: 14px;
        padding: 16px;
        box-sizing: border-box;
      }
      #lobby {
        top: 48px;
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, calc(100% - 32px));
        max-height: calc(100% - 64px);
        overflow: auto;
      }
      #lobby label {
        display: block;
        margin: 6px 0;
      }
      #lobby a,
      #account a {
        color: #efe6c8;
      }
      #sides {
        left: 8px;
        bottom: 8px;
        display: flex;
        gap: 8px;
        padding: 8px;
      }
      #orders {
        left: 8px;
        bottom: 8px;
        width: min(340px, calc(100% - 16px));
        max-height: 45%;
        overflow: auto;
      }
      #orders h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      #orders select,
      #orders textarea {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 4px;
      }
      #orders ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }
      #order-err {
        color: #ff9a8a;
      }
      /* The orders desk is a Svelte paper (OrdersDesk.svelte); the plain HUD panel stays in the DOM but unseen. */
      #orders {
        display: none;
      }
      @media (max-width: 600px) {
        #orders {
          bottom: calc(22% + 16px);
          max-height: 30%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
