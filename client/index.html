<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kriegsspiel</title>
    <style>
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: #2a2118;
        font-family: serif;
      }
      #table {
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
        color: #efe6c8;
        font-size: 13px;
        flex-wrap: wrap;
        max-width: calc(100% - 16px);
      }
      #clock,
      #orders {
        position: fixed;
        background: rgba(42, 33, 24, 0.88);
        color: #efe6c8;
        font-size: 13px;
        padding: 8px;
        border-radius: 4px;
        box-sizing: border-box;
      }
      #clock {
        top: 8px;
        right: 8px;
      }
      #orders {
        left: 8px;
        bottom: 8px;
        width: min(340px, calc(100% - 16px));
        max-height: 45%;
        overflow: auto;
      }
      #orders h2 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      #orders select,
      #orders textarea {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 4px;
      }
      #orders ul {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
      }
      #order-err {
        color: #ff9a8a;
      }
      /* Orders and in-tray are desk objects: shown as papers over the dollied-in desk, hidden at the table. */
      #app:not([data-view='orders']) #orders {
        display: none;
      }
      #app[data-view='orders'] #orders {
        left: 50%;
        right: auto;
        top: 8%;
        bottom: auto;
        transform: translateX(-50%);
        width: min(560px, calc(100% - 16px));
        max-height: 70%;
        background: #f4eedb;
        color: #2a2014;
        padding: 16px 20px;
        z-index: 3;
      }
      #app[data-view='orders'] #orders:focus-visible {
        outline: 3px solid #ffd76a;
      }
      #app[data-view='orders'] #order-err {
        color: #a83232;
      }
      @media (max-width: 600px) {
        #clock {
          top: 44px;
          left: 8px;
          right: auto;
        }
        #orders {
          bottom: calc(22% + 16px);
          max-height: 30%;
        }
        #app[data-view='orders'] #orders {
          top: 8%;
          bottom: auto;
          max-height: 70%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
