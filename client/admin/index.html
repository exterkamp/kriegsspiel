<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Kriegsspiel admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1b1e24;
        --line: #2c313a;
        --fg: #d6dae0;
        --dim: #8a929e;
        --accent: #6cb6ff;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #app {
        display: grid;
        grid-template-rows: auto auto auto 1fr;
        grid-template-columns: minmax(0, 1fr);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        padding: 6px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 13px;
        margin: 0;
        color: var(--accent);
      }
      select,
      input,
      button {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        font: inherit;
        padding: 2px 6px;
      }
      :focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 1px;
      }
      #live {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      #live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--dim);
      }
      #live[data-status='live'] i {
        background: #3fb950;
      }
      #live[data-status='reconnecting'] i,
      #live[data-status='connecting'] i {
        background: #d29922;
      }
      #live[data-status='disabled'] i,
      #live[data-status='unauthorized'] i {
        background: #f85149;
      }
      small {
        color: var(--dim);
      }
      nav {
        display: flex;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 6px 14px;
        cursor: pointer;
      }
      nav button[aria-selected='true'] {
        border-bottom-color: var(--accent);
        color: var(--accent);
      }
      #filterbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 4px 12px;
        border-bottom: 1px solid var(--line);
      }
      #filter {
        width: 280px;
      }
      main {
        overflow: auto;
        padding: 8px 12px;
      }
      .empty {
        color: var(--dim);
      }
      .block {
        margin-bottom: 14px;
      }
      h2 {
        font-size: 13px;
        margin: 8px 0 4px;
        color: var(--accent);
      }
      h3 {
        font-size: 12px;
        margin: 4px 0;
      }
      .kv,
      .field {
        display: flex;
        gap: 10px;
        padding: 1px 4px;
      }
      .k {
        min-width: 110px;
        color: var(--dim);
      }
      .v {
        flex: 1;
        word-break: break-all;
      }
      .vis {
        color: var(--dim);
      }
      .master-only {
        background: rgba(210, 153, 34, 0.16);
        border-left: 3px solid #d29922;
      }
      .master-only .vis {
        color: #d29922;
      }
      .badge {
        margin-left: 8px;
        padding: 0 6px;
        border: 1px solid #d29922;
        color: #d29922;
        font-size: 11px;
        border-radius: 3px;
      }
      .unit {
        border: 1px solid var(--line);
        margin: 4px 0;
        padding: 2px 6px;
      }
      .unit[data-side='blue'] > summary {
        color: #6cb6ff;
      }
      .unit[data-side='red'] > summary {
        color: #ff7b72;
      }
      .queue li {
        word-break: break-all;
      }
      .queue {
        margin: 0;
        padding-left: 28px;
        max-height: 220px;
        overflow: auto;
      }
      .cols {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .col {
        flex: 1;
        min-width: 280px;
      }
      pre {
        margin: 0;
        max-height: 360px;
        overflow: auto;
        background: var(--panel);
        padding: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
