<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Kriegsspiel admin</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14161a;
        --panel: #1b1e24;
        --line: #2c313a;
        --fg: #d6dae0;
        --dim: #8a929e;
        --accent: #6cb6ff;
      }
      html,
      body,
      #app {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 ui-monospace,
          'SF Mono',
          Menlo,
          Consolas,
          monospace;
      }
      #app {
        display: grid;
        grid-template-rows: auto auto auto 1fr;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 6px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 13px;
        margin: 0;
        color: var(--accent);
      }
      select,
      input,
      button {
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        font: inherit;
        padding: 2px 6px;
      }
      :focus-visible {
        outline: 1px solid var(--accent);
        outline-offset: 1px;
      }
      #live {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      #live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--dim);
      }
      #live[data-status='live'] i {
        background: #3fb950;
      }
      #live[data-status='reconnecting'] i,
      #live[data-status='connecting'] i {
        background: #d29922;
      }
      #live[data-status='disabled'] i,
      #live[data-status='unauthorized'] i {
        background: #f85149;
      }
      small {
        color: var(--dim);
      }
      nav {
        display: flex;
        border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 0;
        border-bottom: 2px solid transparent;
        padding: 6px 14px;
        cursor: pointer;
      }
      nav button[aria-selected='true'] {
        border-bottom-color: var(--accent);
        color: var(--accent);
      }
      #filterbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 4px 12px;
        border-bottom: 1px solid var(--line);
      }
      #filter {
        width: 280px;
      }
      main {
        overflow: auto;
        padding: 8px 12px;
      }
      .scrub {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .scrub input {
        flex: 1 1 160px;
        padding: 0;
      }
      .jumps {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 6px 0;
      }
      .result pre {
        margin: 4px 0 8px;
        max-height: 50vh;
        overflow: auto;
      }
      .empty {
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
