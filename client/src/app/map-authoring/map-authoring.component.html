<div class="shell" #root>
  <ks-tool-header heading="Battlefield authoring">
    <p id="asset-status" class="ks-status" role="status">
      No validated map · generate or load a saved asset
    </p>
  </ks-tool-header>
  <aside aria-label="Map inspection controls">
    <section>
      <h2 class="ks-section-h">Asset</h2>
      <div id="summary"></div>
      <p class="note">
        Generate or load a saved battlefield map. Only complete validated maps can be exported.
      </p>
    </section>
    <fieldset>
      <legend>Independent layers</legend>
      <div id="layers"></div>
    </fieldset>
    <label class="ks-choice contrast"
      ><input id="contrast" type="checkbox" /> High-contrast map</label
    >
    <section>
      <h2 class="ks-section-h">Diagnostics</h2>
      <ul id="diagnostics" class="ks-stack" aria-live="polite"></ul>
    </section>
  </aside>
  <main class="map-panel" aria-label="Top-down map preview">
    <nav aria-label="Viewport controls">
      <button id="fit">Fit map</button><button id="detail" disabled>Site detail</button
      ><span class="spacer"></span><button id="zoom-out" aria-label="Zoom out">−</button
      ><button id="zoom-in" aria-label="Zoom in">+</button>
    </nav>
    <div class="canvas-wrap">
      <canvas
        id="map"
        tabindex="0"
        aria-label="Public map asset in local metres. Drag to pan, scroll to zoom; arrow keys pan, plus and minus zoom, F fits the map."
        aria-describedby="map-help"
        >Canvas2D is required to view this map.</canvas
      ><span class="north" aria-hidden="true">↑ N</span>
    </div>
    <footer class="ks-muted">
      <p id="position"></p>
      <p id="map-help">Drag to pan · scroll or + / − to zoom · F to fit · arrows to pan</p>
    </footer>
  </main>
</div>
