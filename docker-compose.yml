# docker compose up -d   ->  http://localhost:${KRIEGSSPIEL_PORT:-3000}
# See docs/deployment.md for configuration, backups and restore.
services:
  kriegsspiel:
    build: .
    image: kriegsspiel
    restart: unless-stopped
    ports:
      - '${KRIEGSSPIEL_PORT:-3000}:3000'
    # Values come from the shell or a git-ignored .env next to this file (see .env.example).
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # With no key the umpire answers with canned responses (the `test` provider). Set a key to use the real model.
      # `ollama` (the default) answers parse, narrate and staff from the small local model below and falls back to `test`
      # while it downloads or if a call fails; `test` uses canned responses only.
      UMPIRE_KEYLESS_PROVIDER: ${UMPIRE_KEYLESS_PROVIDER:-ollama}
      # Where the server reaches Ollama. The service name works on the default compose network; with `network_mode: bridge`
      # point it at the host's published port instead (see docs/deployment.md).
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MAIL_WEBHOOK_URL: ${MAIL_WEBHOOK_URL:-}
      MAIL_WEBHOOK_TOKEN: ${MAIL_WEBHOOK_TOKEN:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # The demo lets visitors play as a guest; set GUEST_PLAY=0 on a public deployment that needs accounts.
      GUEST_PLAY: ${GUEST_PLAY:-1}
      # The demo shows the menu's Developer tools section; set DEV_TOOLS=0 on a public deployment.
      # The menu's Admin view link also needs ADMIN_ENABLED=1 (and a token); without it the admin page reports itself disabled.
      DEV_TOOLS: ${DEV_TOOLS:-1}
      GUEST_PER_HOUR: ${GUEST_PER_HOUR:-}
      GUEST_IDLE_HOURS: ${GUEST_IDLE_HOURS:-}
    volumes:
      - data:/data
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  # A very small local model for the keyless umpire. It starts serving at once and pulls the model in the background
  # (retrying until it succeeds, resuming a partial download), so the game does not wait: until the pull ends the
  # server's calls fail and fall back to the test umpire. CPU only; the model is stored in the `ollama` volume.
  ollama:
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    # Published for hosts that cannot give the services a shared network; bound to the loopback by default.
    ports:
      - '${OLLAMA_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434'
    entrypoint:
      - sh
      - -c
      - |
        ollama serve &
        server=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        (until ollama pull "$$OLLAMA_MODEL"; do sleep 15; done) &
        wait $$server
    # Healthy once the server answers; the model may still be downloading (see `docker compose logs ollama`).
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ollama:/root/.ollama
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # Nightly consistent copy of the database (VACUUM INTO), keeping the newest BACKUP_KEEP.
  backup:
    build: .
    image: kriegsspiel
    restart: unless-stopped
    depends_on: [kriegsspiel]
    environment:
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
    volumes:
      - data:/data
      - ${BACKUP_DIR:-./backups}:/backups
    user: root
    entrypoint: ['sh', '/app/server/backup-loop.sh']
    # Listens on nothing, so the image's HTTP HEALTHCHECK would report unhealthy forever.
    healthcheck:
      disable: true

volumes:
  data:
  ollama:
