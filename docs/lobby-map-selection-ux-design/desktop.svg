<text x="74" y="931" font-family="Georgia, serif" font-size="15" fill="#51442c" font-weight="normal">A computer opponent plays Red.</text>
<rect x="60" y="970" width="540" height="88" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="74" y="997" font-family="Georgia, serif" font-size="18" fill="#2a2118" font-weight="bold">How the game is played</text>
<text x="74" y="1027" font-family="Georgia, serif" font-size="14" fill="#2a2118" font-weight="normal">◉ Real time     ○ Turns, umpire decides</text>
<text x="60" y="1084" font-family="Georgia, serif" font-size="14" fill="#51442c" font-weight="normal">Timing and umpire settings continue below.</text>
