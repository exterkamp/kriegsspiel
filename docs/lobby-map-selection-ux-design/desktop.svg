<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1640" viewBox="0 0 1660 1640" role="img"><title>Desktop lobby map-selection recommendation: entry and two-column map dialogs</title>
<rect width="1660" height="1640" fill="#e9dcb8"/>
<text x="40" y="44" font-family="Georgia, serif" font-size="24" fill="#2a2118" font-weight="bold">LOBBY MAP SELECTION · DESKTOP DESIGN</text>
<text x="40" y="76" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Proposed UI. Add/generate requires durable storage; unpaired terrain cannot start a live battle.</text>
<text x="40" y="124" font-family="Georgia, serif" font-size="20" fill="#2a2118" font-weight="bold">1 / New game entry</text>
<rect x="40" y="144" width="580" height="1092" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="650" y="124" font-family="Georgia, serif" font-size="20" fill="#2a2118" font-weight="bold">2 / Choose saved or default</text>
<rect x="650" y="144" width="970" height="698" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="650" y="868" font-family="Georgia, serif" font-size="20" fill="#2a2118" font-weight="bold">3 / Add and save geography</text>
<rect x="650" y="888" width="970" height="698" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="60" y="184" font-family="Georgia, serif" font-size="15" fill="#2a2118" font-weight="normal">← Main menu</text>
<text x="60" y="232" font-family="Georgia, serif" font-size="34" fill="#2a2118" font-weight="bold">New game</text>
<rect x="60" y="256" width="540" height="154" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="74" y="284" font-family="Georgia, serif" font-size="19" fill="#2a2118" font-weight="bold">Scenario</text>
<text x="74" y="315" font-family="Georgia, serif" font-size="18" fill="#2a2118" font-weight="bold">◉ Hold the Bridge</text>
<text x="74" y="347" font-family="Georgia, serif" font-size="15" fill="#2a2118" font-weight="normal">Blue defends the crossing; Red advances.</text>
<text x="74" y="371" font-family="Georgia, serif" font-size="15" fill="#2a2118" font-weight="normal">Blue must hold for 50 minutes.</text>
<text x="74" y="396" font-family="Georgia, serif" font-size="15" fill="#2a2118" font-weight="normal">▸ Armies and objectives</text>
<rect x="60" y="432" width="540" height="398" rx="3" fill="#f4eedb" stroke="#6f6038"/>
<text x="74" y="461" font-family="Georgia, serif" font-size="19" fill="#2a2118" font-weight="bold">Battlefield map</text>
