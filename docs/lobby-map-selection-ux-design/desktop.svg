<text x="1470" y="1525" font-family="Georgia, serif" font-size="15" fill="#f4eedb" font-weight="normal">Save map</text>
<text x="40" y="1310" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">THE SAME NEW GAME DRAFT</text>
<text x="40" y="1342" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Both dialogs overlay the retained form.</text>
<text x="40" y="1374" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Cancel returns to the original selection.</text>
<text x="40" y="1406" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Use map confirms only an approved pairing.</text>
<text x="40" y="1438" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Save map adds geography to the library.</text>
<text x="40" y="1470" font-family="Georgia, serif" font-size="17" fill="#51442c" font-weight="normal">Only Start game creates and starts play.</text>
<text x="40" y="1608" font-family="Georgia, serif" font-size="16" fill="#51442c" font-weight="normal">Paper/ink controls follow Angular shell tokens. Public terrain thumbnails are schematic; lower form settings abbreviated.</text>
